<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Spec §6.2: sets the theme before any CSS loads, so the first paint is themed.
         There is no CSP today; if one is added, this script's hash goes in it. -->
    <script data-theme-boot>
      (function () { var m = null; try { var s = window.localStorage, v = s.getItem('eov.theme');
        if (v !== 'dark' && v !== 'light') { var o = s.getItem('eov.quantumlab.theme') || s.getItem('eov-color-theme'); if (o === 'dark' || o === 'light') { s.setItem('eov.theme', o); v = o; } }
        s.removeItem('eov.quantumlab.theme'); s.removeItem('eov-color-theme'); if (v === 'dark' || v === 'light') m = v; } catch (e) {}
        if (!m) m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', m); document.documentElement.style.colorScheme = m; })();
    </script>
    <!-- Brass Instrument: tempers the chrome to the stored learning level before paint (a link's visit level is applied
         by the app once it has read the link). The viewer only: /admin.html has no level and wears the Explore temper. -->
    <script data-level-boot>
      (function () { try { var v = window.localStorage.getItem('eov.level');
        if (v === 'basics' || v === 'explore' || v === 'advanced' || v === 'research') document.documentElement.setAttribute('data-level', v); } catch (e) {} })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/electron-icon.svg" />
    <!-- Brass Instrument: the wordmark and titles are set in Source Serif 4 (swap); fetching its latin face now, not when the
         stylesheet is parsed, keeps the first paint's fallback short. Vite hashes the URL; main.tsx's fontsource import emits the same file. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="../node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuantumLab: interactive 3D orbitals, atoms, bonds and molecules, computed from quantum mechanics, with every method and limit stated.">
    <title>QuantumLab</title>
</head>
<body>
    <div id="root"></div> 
    <script type="module" src="/main.tsx"></script>
</body>
</html>
